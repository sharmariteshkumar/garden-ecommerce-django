<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }} - ShopEasy</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            🛒 ShopEasy
        </a>

        <a href="/" class="btn btn-light">
            ← Back to Shop
        </a>
    </div>
</nav>


<div class="container py-5">

    <div class="row bg-white rounded shadow-sm p-4">

        <div class="col-md-6">

            {% if product.image %}

                <img
                    src="{{ product.image.url }}"
                    class="img-fluid rounded"
                    alt="{{ product.name }}"
                >

            {% else %}

                <div
                    class="bg-secondary-subtle rounded d-flex
                    align-items-center justify-content-center"
                    style="height: 400px;"
                >
                    <span class="text-muted">
                        No Image Available
                    </span>
                </div>

            {% endif %}

        </div>


        <div class="col-md-6 p-4">

            <p class="text-muted">
                {{ product.category.name }}
            </p>

            <h1 class="fw-bold">
                {{ product.name }}
            </h1>

            <h2 class="text-success mt-3">
                ₹{{ product.price }}
            </h2>

            <p class="mt-4">
                {{ product.description }}
            </p>

            <p>
                <strong>Available Stock:</strong>
                {{ product.stock }}
            </p>

            <button class="btn btn-dark btn-lg mt-3">
                🛒 Add to Cart
            </button>

        </div>

    </div>

</div>

</body>
</html>
