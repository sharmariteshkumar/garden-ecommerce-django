{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShopEasy Garden | Bring Nature Into Your Home{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --green: #2f6b3f;
            --dark-green: #183c25;
            --light-green: #eef7ed;
            --cream: #faf8f1;
            --white: #ffffff;
            --orange: #d98b45;
            --text: #24352a;
            --muted: #718078;
            --border: #e7ece4;
        }

        body {
            margin: 0;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background: var(--cream);
            line-height: 1.6;
        }

        a { text-decoration: none; }

        /* NAVBAR (Exact from home.html) */
        .main-navbar {
            background: rgba(255, 255, 255, 0.97);
            border-bottom: 1px solid rgba(47, 107, 63, 0.08);
            box-shadow: 0 5px 25px rgba(24, 60, 37, 0.06);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
        }

        .navbar-brand {
            color: var(--dark-green) !important;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-leaf {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            margin-right: 8px;
            border-radius: 12px;
            background: var(--light-green);
            font-size: 1.25rem;
        }

        .brand-subtitle {
            display: block;
            margin-left: 48px;
            margin-top: -7px;
            color: #8a968e;
            font-size: 0.62rem;
            font-weight: 600;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .nav-link {
            color: #526158 !important;
            font-weight: 600;
            font-size: 0.94rem;
            padding: 10px 13px !important;
            border-radius: 10px;
            transition: all 0.25s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--green) !important;
            background: var(--light-green);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            width: 220px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            border: 1px solid #e1e8df;
            background: #f8faf7;
            border-radius: 12px;
            padding: 10px 42px 10px 15px;
            outline: none;
            font-size: 0.88rem;
        }

        .search-box button {
            position: absolute;
            right: 4px;
            top: 4px;
            bottom: 4px;
            width: 36px;
            border: 0;
            border-radius: 9px;
            color: var(--green);
            background: transparent;
        }

        .cart-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 43px;
            height: 43px;
            border-radius: 12px;
            color: var(--green);
            background: var(--light-green);
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            min-width: 19px;
            height: 19px;
            padding: 0 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50px;
            background: var(--orange);
            color: white;
            font-size: 0.68rem;
            font-weight: 800;
            border: 2px solid white;
        }

        /* CARD STYLES */
        .product-card {
            height: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: white;
            box-shadow: 0 8px 25px rgba(24, 60, 37, 0.04);
            transition: all 0.28s ease;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 45px rgba(24, 60, 37, 0.12);
        }

        .product-image-wrap {
            height: 220px;
            overflow: hidden;
            position: relative;
            background: var(--light-green);
        }

        .product-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            background: white;
            color: var(--green);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .product-price {
            color: var(--dark-green);
            font-size: 1.25rem;
            font-weight: 850;
        }

        .product-price::before {
            content: "₹ ";
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <!-- NAVBAR FROM HOME.HTML -->
    <nav class="navbar navbar-expand-lg main-navbar">
        <div class="container py-2">
            <a class="navbar-brand" href="/">
                <span class="brand-leaf">🌿</span>
                ShopEasy
                <span class="brand-subtitle">Garden & Green Living</span>
            </a>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">
                <i class="bi bi-list fs-2" style="color: #2f6b3f;"></i>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mx-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'all_products' %}?category=plants">Plants</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'all_products' %}?category=seeds">Seeds</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/#why-us">Why Us</a>
                    </li>
                </ul>

                <div class="nav-actions">
                    <form class="search-box" method="GET" action="{% url 'all_products' %}">
                        <input type="search" name="q" value="{{ request.GET.q }}" class="form-control"
                            placeholder="Search plants, seeds..." aria-label="Search products">
                        <button type="submit" class="btn btn-light">
                            <i class="bi bi-search"></i>
                        </button>
                    </form>

                    <a href="#" class="nav-link d-none d-lg-block">Login</a>

                    <a href="{% url 'cart' %}" class="cart-btn" aria-label="Shopping cart">
                        <i class="bi bi-bag fs-5"></i>
                        <span class="cart-count">
                            {{ request.session.cart|length|default:"0" }}
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
