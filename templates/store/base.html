{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShopEasy Garden{% endblock %}</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --green: #2f6b3f;
            --dark-green: #183c25;
            --light-green: #eef7ed;
            --cream: #faf8f1;
            --text: #24352a;
            --muted: #718078;
            --border: #e7ece4;
        }

        body {
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background: var(--cream);
            line-height: 1.6;
        }

        /* Navbar Styling */
        .main-navbar {
            background: rgba(255, 255, 255, 0.97);
            border-bottom: 1px solid rgba(47, 107, 63, 0.08);
            box-shadow: 0 5px 25px rgba(24, 60, 37, 0.06);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            color: var(--dark-green) !important;
            font-size: 1.45rem;
            font-weight: 800;
        }

        .brand-leaf {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            margin-right: 8px;
            border-radius: 12px;
            background: var(--light-green);
            font-size: 1.25rem;
        }

        .cart-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 43px;
            height: 43px;
            border-radius: 12px;
            color: var(--green);
            background: var(--light-green);
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            min-width: 19px;
            height: 19px;
            padding: 0 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50px;
            background: #d98b45;
            color: white;
            font-size: 0.68rem;
            font-weight: 800;
        }

        /* Card Design */
        .product-card {
            height: 100%;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: white;
            box-shadow: 0 8px 25px rgba(24, 60, 37, 0.04);
            transition: all 0.28s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 45px rgba(24, 60, 37, 0.12);
        }

        .product-image-wrap {
            height: 220px;
            overflow: hidden;
            position: relative;
            background: var(--light-green);
        }

        .product-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-fresh {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--dark-green);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            z-index: 2;
        }

        .product-price {
            color: var(--dark-green);
            font-size: 1.25rem;
            font-weight: 800;
            line-height: 1;
        }

        .product-price::before {
            content: "₹ ";
            font-size: 1rem;
        }

        .badge-stock {
            color: #198754;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 4px;
        }

        .btn-view-details {
            font-size: 0.85rem;
            font-weight: 700;
            background-color: #eaf5ea;
            color: #198754;
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease-in-out;
        }

        .btn-view-details:hover {
            background-color: #198754;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.25);
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg main-navbar py-2">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="brand-leaf">🌿</span>
                ShopEasy <span style="color: var(--green);">Garden</span>
            </a>

            <div class="d-flex align-items-center gap-3 ms-auto">
                <a href="/"
                    class="btn btn-link text-success text-decoration-none fw-semibold d-none d-md-inline">Home</a>
                <a href="{% url 'all_products' %}?category=plants"
                    class="btn btn-link text-success text-decoration-none fw-semibold d-none d-md-inline">Plants</a>
                <a href="{% url 'all_products' %}?category=seeds"
                    class="btn btn-link text-success text-decoration-none fw-semibold d-none d-md-inline">Seeds</a>

                <a href="{% url 'cart' %}" class="cart-btn text-decoration-none">
                    <i class="bi bi-bag fs-5"></i>
                    <span class="cart-count">
                        {{ request.session.cart|length|default:"0" }}
                    </span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Dynamic Page Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
