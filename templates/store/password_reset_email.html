<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>

<body style="font-family: Arial, sans-serif; background:#f5f8f4; padding:40px;">

    <div style="max-width:600px; margin:auto; background:white; padding:30px; border-radius:12px;">

        <h2 style="color:#2f6b3f;">
            ShopEasy Password Reset
        </h2>

        <p>Hello {{ user.get_username }},</p>

        <p>
            You requested a password reset for your ShopEasy account.
        </p>

        <p>
            Click the button below to create a new password:
        </p>

        <p style="margin:30px 0;">
            <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
               style="background:#2f6b3f; color:white; padding:12px 22px;
                      text-decoration:none; border-radius:6px;">
                Reset Password
            </a>
        </p>

        <p>
            If you didn't request this password reset, you can safely ignore this email.
        </p>

        <p>
            Thanks,<br>
            <strong>ShopEasy Garden</strong>
        </p>

    </div>

</body>
</html>
