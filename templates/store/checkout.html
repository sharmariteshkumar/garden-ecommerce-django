{% extends "store/base.html" %}

{% block content %}

<div class="checkout-container">

    <h1>Checkout</h1>

    <form method="POST" action="{% url 'place_order' %}">
        {% csrf_token %}

        <input
            type="text"
            name="customer_name"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            name="customer_email"
            placeholder="Email"
            required
        >

        <input
            type="text"
            name="customer_phone"
            placeholder="Phone Number"
            required
        >

        <textarea
            name="address"
            placeholder="Full Address"
            required
        ></textarea>

        <input
            type="text"
            name="city"
            placeholder="City"
            required
        >

        <input
            type="text"
            name="state"
            placeholder="State"
            required
        >

        <input
            type="text"
            name="pincode"
            placeholder="PIN Code"
            required
        >

        <h3>Order Summary</h3>

        {% for item in cart_items %}
            <p>
                {{ item.product.name }}
                × {{ item.quantity }}
                — ₹{{ item.item_total }}
            </p>
        {% endfor %}

        <h2>Total: ₹{{ total }}</h2>

        <button type="submit">
            Place Order
        </button>

    </form>

</div>

{% endblock %}
