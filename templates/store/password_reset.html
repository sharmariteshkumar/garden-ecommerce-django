{% extends "store/base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Forgot Password?</h2>

        <p>
            Enter your email address and we'll send you
            a password reset link.
        </p>

        <form method="post" id="resetForm">
            {% csrf_token %}

            {{ form.email.errors }}

            <div class="form-group">
                <label for="{{ form.email.id_for_label }}">
                    Email Address
                </label>

                {{ form.email }}
            </div>

            <button type="submit" id="resetButton">
                <span id="resetButtonText">Send Reset Link</span>

                <span id="resetLoading" style="display: none;">
                    <span class="reset-spinner"></span>
                    Sending Reset Link...
                </span>
            </button>
        </form>

        <style>
            .reset-spinner {
                width: 16px;
                height: 16px;
                border: 2px solid rgba(255, 255, 255, 0.4);
                border-top-color: white;
                border-radius: 50%;
                display: inline-block;
                vertical-align: -3px;
                margin-right: 8px;
                animation: resetSpin 0.7s linear infinite;
            }

            @keyframes resetSpin {
                to {
                    transform: rotate(360deg);
                }
            }

            #resetButton:disabled {
                opacity: 0.75;
                cursor: not-allowed;
            }
        </style>

        <script>
            document.getElementById("resetForm").addEventListener("submit", function () {

                const button = document.getElementById("resetButton");
                const buttonText = document.getElementById("resetButtonText");
                const loading = document.getElementById("resetLoading");

                button.disabled = true;
                buttonText.style.display = "none";
                loading.style.display = "inline";

            });
        </script>

        <div class="auth-links">
            <a href="{% url 'login' %}">
                Back to Login
            </a>
        </div>

    </div>

</div>

{% endblock %}
