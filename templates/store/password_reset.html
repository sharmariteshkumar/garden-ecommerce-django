{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Forgot Password?</h2>

        <p>
            Enter your email address and we'll send you
            a password reset link.
        </p>

        <form method="post">
            {% csrf_token %}

            {{ form.email.errors }}

            <div class="form-group">
                <label for="{{ form.email.id_for_label }}">
                    Email Address
                </label>

                {{ form.email }}
            </div>

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <div class="auth-links">
            <a href="{% url 'login' %}">
                Back to Login
            </a>
        </div>

    </div>

</div>

{% endblock %}
