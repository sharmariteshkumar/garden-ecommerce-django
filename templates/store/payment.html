<!DOCTYPE html>
<html>

<head>
    <title>Secure Payment - ShopEasy Garden</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .payment-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
            width: 380px;
        }

        button {
            background: #111;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }

        button:hover {
            opacity: 0.9;
        }

        /* =========================
           PAYMENT PROCESSING
        ========================= */

        .payment-processing {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(255, 255, 255, 0.97);
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .processing-box {
            background: #ffffff;
            border-radius: 18px;
            padding: 35px 30px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 15px 50px rgba(25, 61, 41, 0.15);
            border: 1px solid #e5ebe5;
        }

        .processing-spinner {
            width: 48px;
            height: 48px;
            margin: 0 auto 20px;
            border: 4px solid #dce8df;
            border-top-color: #16733d;
            border-radius: 50%;
            animation: paymentSpin 0.8s linear infinite;
        }

        .processing-box h2 {
            color: #173d29;
            margin: 0 0 10px;
            font-size: 23px;
        }

        .processing-box p {
            color: #718078;
            margin: 0;
            font-size: 14px;
            line-height: 1.6;
        }

        @keyframes paymentSpin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="payment-box">

        <h2>Complete Payment</h2>

        <p>
            Order:
            <strong>{{ order.order_number }}</strong>
        </p>

        <h3>
            ₹{{ total }}
        </h3>

        <button id="pay-button">
            Pay ₹{{ total }}
        </button>

    </div>


    <!-- =========================
         PAYMENT PROCESSING SCREEN
    ========================== -->

    <div class="payment-processing" id="paymentProcessing">

        <div class="processing-box">

            <div class="processing-spinner"></div>

            <h2>Processing your payment</h2>

            <p>
                Payment received successfully.<br>
                Please wait while we confirm your order.
            </p>

        </div>

    </div>


    <script>

        /*
         * Show processing screen
         */
        function showPaymentProcessing() {

            const processingScreen =
                document.getElementById("paymentProcessing");

            processingScreen.style.display = "flex";

            // Prevent user from clicking the page again
            document.body.style.overflow = "hidden";
        }


        const options = {

            key: "{{ razorpay_key_id }}",

            amount: "{{ amount }}",

            currency: "INR",

            name: "ShopEasy Garden",

            description: "Order {{ order.order_number }}",

            order_id: "{{ razorpay_order_id }}",

            handler: function (response) {

                console.log(
                    "RAZORPAY SUCCESS RESPONSE:",
                    response
                );


                /*
                 * Show processing screen BEFORE
                 * sending payment details to backend.
                 */
                showPaymentProcessing();


                const form = document.createElement("form");

                form.method = "POST";
                form.action = "{% url 'payment_success' %}";


                const orderId = document.createElement("input");

                orderId.type = "hidden";
                orderId.name = "razorpay_order_id";
                orderId.value = response.razorpay_order_id;


                const paymentId = document.createElement("input");

                paymentId.type = "hidden";
                paymentId.name = "razorpay_payment_id";
                paymentId.value = response.razorpay_payment_id;


                const signature = document.createElement("input");

                signature.type = "hidden";
                signature.name = "razorpay_signature";
                signature.value = response.razorpay_signature;


                form.appendChild(orderId);
                form.appendChild(paymentId);
                form.appendChild(signature);


                document.body.appendChild(form);


                /*
                 * Small delay so browser gets time
                 * to display the processing screen.
                 */
                setTimeout(function () {

                    form.submit();

                }, 150);

            },


            theme: {
                color: "#111111"
            }

        };


        const rzp = new Razorpay(options);


        rzp.on("payment.failed", function (response) {

            console.error(
                "RAZORPAY PAYMENT FAILED:",
                response
            );

            alert(
                "Payment failed: " +
                (response.error?.description || "Unknown error")
            );

            window.location.href =
                "{% url 'payment_failed' %}";

        });


        document.getElementById("pay-button")
            .addEventListener("click", function (e) {

                e.preventDefault();

                rzp.open();

            });

    </script>

</body>

</html>
